# Repository tooling for temporalio/worker-integrations: CI helpers and their tests.
# This is a plain uv project (not a package, never published) and is deliberately NOT a
# workspace root for the packages under python/.
#
# Run any script with:  uv run --project scripts --locked python scripts/ci/<name>.py ...
# Run the tests with:   uv run --project scripts --locked pytest scripts/tests -q
#
# requires-python is 3.11+ because the scripts rely on `tomllib`; GitHub-hosted runners
# always provide a newer interpreter.
[project]
name = "worker-integrations-scripts"
version = "0"
description = "Repository tooling for temporalio/worker-integrations (not published)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=9,<10", "pyyaml>=6,<7"]

[tool.uv]
package = false
required-version = ">=0.12.5,<0.13"
exclude-newer = "2 weeks"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
