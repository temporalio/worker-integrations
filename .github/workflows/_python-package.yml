# Reusable workflow for ONE Python package, called by ci.yml once per changed package.
# Package-specific behavior is data (python/<package>/integration.toml, pyproject.toml, Makefile);
# never edit this file for package-specific things.
name: Python package

on:
  workflow_call:
    inputs:
      package:
        description: Package folder name under python/ (e.g. aws_lambda_worker)
        type: string
        required: true
      deps:
        description: Space-separated dependency modes for the matrix (locked, lowest, latest; see scripts/ci/matrix.py)
        type: string
        required: true
      version:
        description: Release version to build, e.g. 0.1.0 (release-python-dry-run.yml passes it from the tag; empty in ordinary CI, which builds the 0.0.0 placeholder)
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  matrix:
    name: matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - id: matrix
        env:
          PACKAGE: ${{ inputs.package }}
          DEPS: ${{ inputs.deps }}
        # $DEPS is deliberately unquoted so that each mode becomes one argument; matrix.py rejects unknown modes.
        run: uv run --project scripts --locked python scripts/ci/matrix.py --package-dir "python/$PACKAGE" --deps $DEPS --github-output "$GITHUB_OUTPUT"

  test:
    name: ${{ inputs.package }} (${{ matrix.os }}, py${{ matrix.runtime }}, ${{ matrix.deps }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      PACKAGE_DIR: python/${{ inputs.package }} # run steps `cd` here; never interpolate inputs into run blocks
      UV_NO_EDITABLE: "1" # an editable install can't extend the SDK-owned temporalio package from src/
      UV_LINK_MODE: copy
      DEPS: ${{ matrix.deps }} # read by every make target (python/_shared/python.mk)
      RELEASE_VERSION: ${{ inputs.version }} # empty outside releases
      COLUMNS: "120"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.runtime }}
          version-file: python/${{ inputs.package }}/pyproject.toml
          enable-cache: true
          cache-dependency-glob: python/${{ inputs.package }}/uv.lock
      - name: Install GNU make (Windows)
        if: runner.os == 'Windows'
        run: choco install make -y --no-progress
      - name: Set the release version
        if: inputs.version != ''
        # Updates pyproject.toml and the package's own entry in uv.lock. --no-sync leaves installing
        # to `make sync`, which uses this cell's dependency mode.
        run: cd "$PACKAGE_DIR" && uv version "$RELEASE_VERSION" --no-sync
      - name: Sync environment
        run: cd "$PACKAGE_DIR" && make sync
      - name: Lint and type-check
        run: cd "$PACKAGE_DIR" && make lint
      - name: Test
        run: cd "$PACKAGE_DIR" && make test
      - name: Build distributions
        if: matrix.build
        run: cd "$PACKAGE_DIR" && make build
      - name: Verify distributions
        if: matrix.build
        run: uv run --project scripts --locked python scripts/ci/python/check_wheel.py --package-dir "$PACKAGE_DIR" --version "$RELEASE_VERSION"
      - name: Smoke-test distributions
        if: matrix.build
        run: uv run --project scripts --locked python scripts/ci/python/smoke.py --package-dir "$PACKAGE_DIR"
