# Release workflow for ONE Python package, started by publishing its GitHub release (tag
# python/<package>/v<version>, e.g. python/aws_lambda_worker/v0.1.0). It has no manual trigger:
# dispatch release-python-dry-run.yml to try a release without publishing anything.
#
#   dry-run           -> release-python-dry-run.yml for the tag: checks, tests, and builds the
#                        distributions into the run's dist-<package> artifact
#   verify            -> checks that only apply to a real release: the tag is on main, and the
#                        GitHub release's pre-release flag is right
#   publish-testpypi  -> uploads the artifact to TestPyPI
#   smoke-testpypi    -> smoke-tests the files TestPyPI serves (scripts/ci/python/smoke.py)
#   publish-pypi      -> uploads the same artifact to PyPI
#   smoke-pypi        -> smoke-tests installing the version from PyPI, as a user would
#
# Publishing uses PyPI trusted publishing: PyPI accepts this workflow's GitHub OIDC token for the
# package, so there are no stored credentials. The publish jobs must be in this file, since PyPI
# can't trust a job in a reusable workflow, and they're the only jobs that can request a token.
# They never build anything: what they upload is the artifact the dry run tested.
#
# If a job fails, re-run only the failed jobs: on the run's page in GitHub Actions, "Re-run jobs" >
# "Re-run failed jobs" (or `gh run rerun <run ID> --failed`). The uploads skip files that are
# already there. Re-running all jobs fails the dry run's check once the version is on PyPI, since
# every release must be a new version. If this workflow itself needs a fix, merge it and release
# the next version.
name: Release (Python)

on:
  release:
    types: [published]

permissions: {}

defaults:
  run:
    shell: bash

# A second run for the same tag waits for the first, so the two can't race to upload the same
# version. That shouldn't be possible anyway: the repository has immutable releases enabled, so a
# tag can't get a second published release, even after its release is deleted. This guard is just
# here for safety. It's per tag rather than one group for every release, since GitHub keeps only
# one pending run per group and cancels older ones.
concurrency:
  group: release-python-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry run
    # Release events fire for every language's tags
    if: startsWith(github.event.release.tag_name, 'python/')
    permissions:
      contents: read
    uses: ./.github/workflows/release-python-dry-run.yml
    with:
      tag: ${{ github.event.release.tag_name }}

  verify:
    name: Verify release
    needs: dry-run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for origin/main
          persist-credentials: false
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::release tags must point at a commit on main"; exit 1; }
      - name: The GitHub release's pre-release flag is right
        env:
          EXPECTED: ${{ needs.dry-run.outputs.prerelease }}
          ACTUAL: ${{ github.event.release.prerelease }}
        run: |
          [ "$EXPECTED" = "$ACTUAL" ] \
            || { echo "::error::the GitHub release's pre-release flag must be $EXPECTED (see check_release.py)"; exit 1; }

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [dry-run, verify]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.dry-run.outputs.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # for "Re-run failed jobs" after a partial upload

  smoke-testpypi:
    name: Smoke-test from TestPyPI
    needs: [dry-run, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - name: Smoke-test the files on TestPyPI
        env:
          PACKAGE: ${{ needs.dry-run.outputs.package }}
          VERSION: ${{ needs.dry-run.outputs.version }}
        run: uv run --project scripts --locked python scripts/ci/python/smoke.py --package-dir "python/$PACKAGE" --index testpypi --version "$VERSION"

  publish-pypi:
    name: Publish to PyPI
    needs: [dry-run, smoke-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.dry-run.outputs.package }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          skip-existing: true # for "Re-run failed jobs" after a partial upload

  smoke-pypi:
    name: Smoke-test from PyPI
    needs: [dry-run, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version-file: scripts/pyproject.toml
      - name: Smoke-test installing from PyPI
        env:
          PACKAGE: ${{ needs.dry-run.outputs.package }}
          VERSION: ${{ needs.dry-run.outputs.version }}
        run: uv run --project scripts --locked python scripts/ci/python/smoke.py --package-dir "python/$PACKAGE" --index pypi --version "$VERSION"
